# API Automation Configuration - QA Environment
api.base.url=https://api-qa.example.com
api.version=v1
api.timeout.connect=10000
api.timeout.socket=10000
api.timeout.read=30000

# Authentication
api.auth.type=bearer
api.auth.token.url=https://api-qa.example.com/oauth/token
api.client.id=test-client
api.client.secret=test-secret

# Request/Response Logging
api.logging.request=true
api.logging.response=true
api.logging.pretty.print=true

# Test Data
api.test.data.path=src/test/resources/testdata/api
api.template.path=src/test/resources/templates

# Rate Limiting
api.rate.limit.enabled=true
api.rate.limit.requests=100
api.rate.limit.period=60
