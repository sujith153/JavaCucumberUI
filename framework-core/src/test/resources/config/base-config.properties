# Framework Core Configuration
framework.environment=qa
framework.timeout.default=30
framework.retry.count=3

# Reporting Configuration
report.base.dir=target/cucumber-reports
report.screenshot.dir=target/screenshots
report.enabled=true
report.generate.pdf=true

# Mail Configuration (for report distribution)
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.enabled=false

# Logging Configuration
log.level=INFO
log.file.path=target/logs/test.log
