# Selenium UI Configuration - QA Environment
selenium.browser=chrome
selenium.headless=false
selenium.timeout=30
selenium.window.maximize=true
selenium.implicit.wait=10
selenium.page.load.timeout=30

# WebDriver Paths
webdriver.chrome.driver=drivers/chromedriver.exe
webdriver.gecko.driver=drivers/geckodriver.exe

# Application URLs
app.base.url=https://qa.example.com
app.admin.url=https://qa-admin.example.com

# Test Data
test.data.path=src/test/resources/testdata/qa
test.user.username=qa.user@example.com
test.user.password=qa123
