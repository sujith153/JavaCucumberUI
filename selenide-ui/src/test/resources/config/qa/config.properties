# Selenide UI Configuration - QA Environment
selenide.browser=chrome
selenide.headless=false
selenide.timeout=10000
selenide.startMaximized=true
selenide.holdBrowserOpen=false
selenide.screenshots=true
selenide.savePageSource=false

# Application URLs
selenide.baseUrl=https://qa.example.com
selenide.downloadFolder=target/downloads

# Screenshot Settings
selenide.reportsFolder=target/selenide-reports
selenide.screenshot.strategy=FULL_SCROLL
